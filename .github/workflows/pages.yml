name: Research archive validation and Pages

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-archive-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run archive tests
        run: python -m unittest discover -s tests -v

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Stage the approved public archive only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/src/db/temp dist/src/db/store/MSA dist/src/images/.png
          cp index.html 404.html robots.txt LICENSE dist/
          cp src/db/Congress.db dist/src/db/
          cp src/db/temp/mass_shootings.db dist/src/db/temp/
          cp "src/db/store/MSA/Stanford_MSA_Data_Dictionary (V.5).pdf" dist/src/db/store/MSA/
          cp src/db/store/Abbreviations.sql dist/src/db/store/
          cp src/images/.png/Grades.png dist/src/images/.png/
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/src/db/Congress.db
          test -f dist/src/db/temp/mass_shootings.db
          test -f "dist/src/db/store/MSA/Stanford_MSA_Data_Dictionary (V.5).pdf"
          test -f dist/src/db/store/Abbreviations.sql
          test -f dist/src/images/.png/Grades.png
          test ! -e dist/.github
          test ! -e dist/tests
          test ! -e dist/README.md
          test ! -e dist/.gitignore
      - name: Upload approved Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
